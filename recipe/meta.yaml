{% set name = "sse-starlette" %}
{% set version = "3.4.4" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 07e0fa0460138baf25cdd5fb28683472c3995dc1642225191b3832d62526bcb0

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv  --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pdm-backend
    - pip
    - pytest-runner >=6.0.0
    - setuptools
  run:
    - python
    - anyio >=4.7.0
    - starlette >=0.49.1
  run-constrained:
    - uvicorn >=0.34.0
    - fastapi >=0.115.12
    - pydantic >=2
    - sqlalchemy >=2.0.41
    - aiosqlite >=0.21.0
    - uvicorn >=0.34.0
    - granian >=2.3.1
    - daphne >=4.2.0

# Those tests relay on anyio_compat.py which is not a part of pypi package.
# Even if download package from github, anyio_compat.py use asgi-lifespan which is not supported by Anaconda.
{% set ignored_tests = "--ignore=tests/test_issue167.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_sse.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_issue152.py" %}

# Fail in Anaconda environment
{% set disabled_tests = "not test_manual_shutdown_ignores_signal" %}
{% set disabled_tests = disabled_tests + " and not test_uvicorn_should_exit_ignored_when_disabled" %}

test:
  source_files:
    - tests
  imports:
    - sse_starlette
  commands:
    - pip check
    - python -m pytest -k "{{ disabled_tests }}" -v tests/ {{ ignored_tests }}
  requires:
    - pip
    - pytest
    - pytest-asyncio >=1.3.0
    - httpx >=0.28.1

about:
  home: https://github.com/sysid/sse-starlette
  summary: SSE plugin for Starlette
  description: SSE plugin for Starlette
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/sysid/sse-starlette
  doc_url: https://github.com/sysid/sse-starlette/blob/main/README.md


extra:
  recipe-maintainers:
    - dhirschfeld
    - cyprienc
